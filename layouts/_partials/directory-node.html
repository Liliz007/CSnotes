{{- $page := . -}}
{{- if $page.IsSection -}}
  <details class="directory-node">
    <summary>{{ $page.LinkTitle }}</summary>
    <div class="directory-children">
      <ul>
        {{- range (where $page.Pages "Params.bookHidden" "ne" true).ByWeight }}
          <li>{{ partial "directory-node.html" . }}</li>
        {{- end }}
      </ul>
    </div>
  </details>
{{- else if and $page.IsPage $page.Content -}}
  <a class="directory-page" href="{{ $page.RelPermalink }}">{{ $page.LinkTitle }}</a>
{{- end -}}
