baseURL = 'https://Liliz007.github.io/CSnotes/'
locale = 'zh-cn'
defaultContentLanguage = 'zh-cn'
title = '我的学习笔记'
theme = 'hugo-book'

# 保留 URL 大小写（如 /大三/OS/ 而非 /大三/os/）
disablePathToLower = true

# Markdown 渲染与代码高亮
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 1
  [markup.highlight]
    noClasses = false

[params]
  # 主题：青瓷与秘色，自动明暗切换
  BookTheme = 'celadon-auto'
  # 侧边栏 logo
  BookLogo = 'avatar.jpg'
  # 文章目录
  BookToC = true
  # 页面顶部面包屑
  BookBreadcrumbs = true
  # 侧边栏渲染所有顶级分区（大一 / 大二 / 大三）
  BookSection = '/'
  # 全文搜索（含中文分词）
  BookSearch = true

# 保留年级分区以组织课程，只发布统一目录。
[[cascade]]
  [cascade.target]
    path = '/大二'
    kind = 'section'
  [cascade.build]
    render = 'never'

[[cascade]]
  [cascade.target]
    path = '/大三'
    kind = 'section'
  [cascade.build]
    render = 'never'
